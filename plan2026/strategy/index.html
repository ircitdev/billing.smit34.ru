    <script data-tariff-bridge="1">
      // Кнопка «Запросить демо» в карточке тарифа открывает разговор с готовым
      // вопросом: человек уже выбрал версию, спрашивать «какая интересует» незачем.
      (function () {
        function cardTitle(btn) {
          var n = btn.parentElement, depth = 0;
          while (n && depth < 6) {
            var h = n.querySelector('h1,h2,h3,h4');
            if (h && h.textContent.trim()) return h.textContent.trim();
            n = n.parentElement;
            depth++;
          }
          return '';
        }
        document.addEventListener('click', function (e) {
          var btn = e.target.closest('button, a');
          if (!btn || !/запросить/i.test(btn.textContent || '')) return;
          var W = window.SmitWidget;
          if (!W || !W.ask) return;               // виджет не загрузился — не мешаем
          var name = cardTitle(btn);
          if (!name) { W.book(); return; }        // кнопка вне карточки — форма записи
          e.preventDefault();
          W.ask('Хочу посмотреть СмИТ Биллинг ' + name);
        }, true);
      })();
    </script>
