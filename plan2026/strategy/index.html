// Кнопка «Запросить демо» в карточке тарифа открывает разговор с готовым
// вопросом: человек уже выбрал версию, спрашивать «какая интересует» незачем.
(function () {
  function cardTitle(btn) {
    var n = btn.parentElement, depth = 0;
    while (n && depth < 6) {
      var h = n.querySelector('h1,h2,h3,h4');
      if (h && h.textContent.trim()) return h.textContent.trim();
      n = n.parentElement;
      depth++;
    }
    return '';
  }
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button, a');
    if (!btn || !/запросить/i.test(btn.textContent || '')) return;
    var W = window.SmitWidget;
    if (!W || !W.ask) return;               // виджет не загрузился — не мешаем
    var name = cardTitle(btn);
    if (!name) { W.book(); return; }        // кнопка вне карточки — форма записи
    e.preventDefault();
    W.ask('Хочу посмотреть СмИТ Биллинг ' + name);
  }, true);
})();
</script>

(function () {
  var QUESTION = 'Расскажи коротко о стратегии СмИТ Биллинга';

  function place() {
    if (document.getElementById('smit-ask-strategy')) return;
    var near = [].slice.call(document.querySelectorAll('button'))
      .find(function (b) { return b.textContent.trim() === 'Спросить у AI'; });
    if (!near || !near.parentElement) return;

    var btn = document.createElement('button');
    btn.id = 'smit-ask-strategy';
    btn.type = 'button';
    btn.className = near.className;           // тот же размер и форма, что у соседа
    btn.style.background = '#10b981';
    btn.style.color = '#fff';
    btn.style.fontWeight = '600';
    btn.textContent = 'Обсудить с AI';
    btn.addEventListener('click', function () {
      var W = window.SmitWidget;
      if (W && W.ask) W.ask(QUESTION);
      else if (W && W.open) W.open('chat');   // виджет старой версии — хотя бы откроем
    });
    near.parentElement.insertBefore(btn, near.nextSibling);
  }

  place();
  // страница перерисовывается — возвращаем кнопку на место
  try {
    new MutationObserver(place).observe(document.body, { childList: true, subtree: true });
  } catch (e) {

  }

// Шапка портала: короткое имя автора (длинное обрезалось) и актуальные
// версия, дата и номер сборки.
(function () {
  var RULES = [
    [/Александр\s+Успешный/g, 'Успешный А. С.'],
    [/Build\s*2286/gi, 'Build 2405'],
    [/1\.3 от 30\.08\.2026/g, '1.4 от 02.09.2026'],
    [/1\.3 от 30\.08\.2025/g, '1.4 от 02.09.2026']
  ];

  function fixText(node) {
    var value = node.nodeValue, changed = false;
    RULES.forEach(function (r) {
      r[0].lastIndex = 0;
      if (r[0].test(value)) {
        r[0].lastIndex = 0;
        value = value.replace(r[0], r[1]);
        changed = true;
      }
    });
    if (changed) node.nodeValue = value;
  }

  function scan(root) {
    if (!root) return;
    if (root.nodeType === 3) { fixText(root); return; }
    if (root.nodeType !== 1) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var n;
    while ((n = walker.nextNode())) fixText(n);
  }

  scan(document.body);
  try {
    new MutationObserver(function (records) {
      records.forEach(function (r) { [].forEach.call(r.addedNodes, scan); });
    }).observe(document.body, {childList: true, subtree: true});
  } catch (e) {}
})();
</script>

        '<rect x="14" y="14" width="7" height="7" rx="1.6"/>' +
        '<path d="M10 6.5h4M6.5 10v4M17.5 10v4M10 17.5h4"/>';
    }

    var leaves = [].slice.call(card.querySelectorAll('*')).filter(function (e) {
      return e.children.length === 0 && e.textContent.trim();
    });
    var texts = ['Схемы системы', 'docs.billing.smit34.ru/Workflow',
                 '16 интерактивных схем: архитектура, процессы, деньги'];
    leaves.forEach(function (el, i) { if (texts[i]) el.textContent = texts[i]; });

  place();

  } catch (e) {}
})();

<script data-wf-fix="1">
// Мелкие правки портала: полосы переключателей, единственная кнопка AI,
// оформление карточек и панель с рассказом об авторе.
(function () {
  var QUESTION = 'Расскажи коротко о стратегии СмИТ Биллинга';
  var AUTHOR = 'Успешный А. С.';

  // ── полосы кнопок помещаются целиком ─────────────────────────────────
  function fitBars() {
    [].forEach.call(document.querySelectorAll('div'), function (bar) {
      var kids = bar.children;
      if (kids.length < 2 || kids.length > 8) return;
      for (var i = 0; i < kids.length; i++) if (kids[i].tagName !== 'BUTTON') return;
      if (getComputedStyle(bar).display !== 'flex') return;
      if (bar.classList.contains('wf-fit-bar')) return;
      if (bar.scrollWidth > bar.clientWidth + 2) bar.classList.add('wf-fit-bar');
    });
  }

  // ── одна кнопка AI, сразу с вопросом ─────────────────────────────────
  function singleAiButton() {
    [].forEach.call(document.querySelectorAll('button'), function (b) {
      if (b.dataset.wfAsk || b.id === 'smit-ask-strategy') return;
      if (b.textContent.trim() !== 'Спросить у AI') return;
      b.dataset.wfAsk = '1';
      b.addEventListener('click', function (e) {
        var W = window.SmitWidget;
        if (!W || !W.ask) return;
        e.preventDefault();
        e.stopPropagation();
        W.ask(QUESTION);
      }, true);
    });
  }

  // ── карточки: цифры рынка и тезисы ───────────────────────────────────
  // ── плитки с цифрами: выстраиваем в одну линию ───────────────────────
  function statGrids() {
    var market = document.getElementById('market');
    if (!market) return;
    [].forEach.call(market.querySelectorAll('div'), function (g) {
      var kids = g.children;
      if (kids.length < 3 || kids.length > 6) return;
      var disp = getComputedStyle(g).display;
      if (disp !== 'grid' && disp !== 'flex') return;
      var allDivs = [].every.call(kids, function (c) { return c.tagName === 'DIV'; });
      if (!allDivs) return;
      var numeric = [].every.call(kids, function (c) {
        return /\d/.test((c.textContent || '').slice(0, 40));
      });
      if (!numeric) return;
      g.classList.add('wf-stat-grid');
      // сколько плиток — столько колонок: всё помещается в один ряд
      if (window.matchMedia('(min-width: 900px)').matches) {
        g.style.gridTemplateColumns = 'repeat(' + kids.length + ', minmax(0, 1fr))';
      } else {
        g.style.gridTemplateColumns = '';
      }
    });
  }

  // ── карточки тезисов: подложка и цветной номер ───────────────────────
  function thesisCards() {
    var tldr = document.getElementById('tldr');
    if (!tldr) return;
    [].forEach.call(tldr.querySelectorAll('div'), function (g) {
      var kids = g.children;
      if (kids.length < 4 || kids.length > 6) return;
      var disp = getComputedStyle(g).display;
      if (disp !== 'grid' && disp !== 'flex') return;
      var numbered = [].every.call(kids, function (c) {
        return c.tagName === 'DIV' && /^\s*0\d[.\s]/.test((c.textContent || '').trim());
      });
      if (!numbered) return;
      [].forEach.call(kids, function (c) {
        // подложка ложится на внешний контур, родная карточка остаётся как есть
        c.classList.add('wf-thesis');
        c.dataset.wfIndex = [].indexOf.call(kids, c) + 1;
        var badge = c.querySelector('div, span, p');
        if (badge && /^\s*0\d[.\s]/.test(badge.textContent.trim())) {
          badge.classList.add('wf-thesis-num');
        }
      });
    });
  }

  // ── панель об авторе ─────────────────────────────────────────────────
  function buildBio(avatarSrc) {
    var back = document.createElement('div');
    back.className = 'wf-bio-backdrop';

    var panel = document.createElement('aside');
    panel.className = 'wf-bio';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-label', 'Об авторе');
    panel.innerHTML =
      '<div class="wf-bio-head">' +
        (avatarSrc ? '<img src="' + avatarSrc + '" alt="">' : '') +
        '<div><div class="wf-bio-name">Успешный Александр Сергеевич</div>' +
        '<div class="wf-bio-role">Архитектор AI-маркетинговых систем</div></div>' +
        '<button class="wf-bio-close" type="button" aria-label="Закрыть">×</button>' +
      '</div>' +
      '<div class="wf-bio-body">' +
        '<div class="wf-bio-facts">' +
          '<div class="wf-bio-fact"><b>15+</b><span>лет в IT и автоматизации</span></div>' +
          '<div class="wf-bio-fact"><b>MBA</b><span>CIO, РАНХиГС</span></div>' +
          '<div class="wf-bio-fact"><b>30–45</b><span>дней система под ключ</span></div>' +
        '</div>' +
        '<p>Пятнадцать лет строил системы, которые должны работать без ручного ' +
        'управления, — иначе компания встаёт. Сейчас делает то же самое для ' +
        'небольших команд: чтобы клиенту отвечали, когда все заняты, а заявка не ' +
        'терялась между перепиской, звонком и блокнотом.</p>' +
        '<h4>Подход</h4>' +
        '<p>Не разовая настройка, а система: контент → интерес → заявка → продажа. ' +
        'Сначала карта, где сейчас теряются клиенты, затем сборка за 30–45 дней, ' +
        'дальше ежемесячная правка по цифрам — переделывать через полгода не придётся.</p>' +
        '<h4>Связь</h4>' +
        '<div class="wf-bio-links">' +
          '<a href="https://uspeshnyy.ru/about" target="_blank" rel="noopener">uspeshnyy.ru</a>' +
          '<a href="https://t.me/uspeshnyy" target="_blank" rel="noopener">Telegram</a>' +
          '<a href="tel:+79169535760">+7 916 953-57-60</a>' +
        '</div>' +
      '</div>';

    document.body.appendChild(back);
    document.body.appendChild(panel);

    function close() {
      panel.classList.remove('open');
      back.classList.remove('open');
    }
    back.addEventListener('click', close);
    panel.querySelector('.wf-bio-close').addEventListener('click', close);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });
    return { panel: panel, back: back };
  }

  var bio = null;
  function openBio(avatarSrc) {
    if (!bio) bio = buildBio(avatarSrc);
    bio.panel.classList.add('open');
    bio.back.classList.add('open');
  }

  function bindAuthor() {
    [].forEach.call(document.querySelectorAll('span, div, a, p'), function (el) {
      if (el.dataset.wfAuthor) return;
      if (el.children.length) return;
      if (el.textContent.trim() !== AUTHOR) return;
      el.dataset.wfAuthor = '1';
      el.classList.add('wf-author-link');
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      var holder = el.closest('div');
      var img = holder ? holder.querySelector('img') : null;
      var src = img ? img.src : '';
      el.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        openBio(src);
      });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBio(src); }
      });
    });
  }

  function run() { fitBars(); singleAiButton(); statGrids(); thesisCards(); bindAuthor(); }

  run();
  try {
    new MutationObserver(run).observe(document.body, { childList: true, subtree: true });
  } catch (e) {}
  window.addEventListener('resize', function () { fitBars(); statGrids(); });
})();
</script>

<script data-wf-order="1">
// Порядок разделов: сначала выводы, затем рынок и анализ, потом что делаем,
// как идёт исполнение, живые доказательства и уже под конец — коммерция.
// Раздел «Главная стратегическая рекомендация» стоял в середине коммерческого
// блока, а «Прогресс реализации» — в самом конце, оторванный от рекомендаций.
(function () {
  var ORDER = [
    'tldr',            // тезисы за 60 секунд
    'tldr-details',    // и сразу главная рекомендация
    'market',
    'competitors',
    'table',
    'strengths',
    'weaknesses',
    'risks',
    'recommendations',
    'wf-progress',     // прогресс по этим же рекомендациям
    'status',
    'live',
    'schemes',
    'pricing',
    'positioning',
    'conclusion'
  ];

  function markProgress(main) {
    // у раздела с прогрессом нет своего идентификатора — находим по заголовку
    [].forEach.call(main.children, function (el) {
      if (el.id) return;
      var h = el.querySelector('h2,h3');
      if (h && h.textContent.indexOf('Прогресс реализации') >= 0) el.id = 'wf-progress';
    });
  }

  function apply() {
    var main = document.querySelector('main');
    if (!main) return;
    markProgress(main);

    var known = ORDER.map(function (id) { return document.getElementById(id); }).filter(Boolean);
    if (known.length < ORDER.length - 1) return;   // страница ещё дорисовывается

    var actual = [].filter.call(main.children, function (el) { return ORDER.indexOf(el.id) >= 0; })
                   .map(function (el) { return el.id; }).join(',');
    if (actual === known.map(function (el) { return el.id; }).join(',')) return;

    known.forEach(function (el) { main.appendChild(el); });
  }

  apply();
  try {
    new MutationObserver(apply).observe(document.querySelector('main') || document.body,
                                        { childList: true });
  } catch (e) {}
})();
</script>
